    <path d="M148 168 L256 358 L364 168" fill="none" stroke="#ffffff" stroke-width="36" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Heart & Environmental Leaf symbol in center -->
    <path d="M256 220 C236 195 198 198 198 232 C198 268 256 312 256 312 C256 312 314 268 314 232 C314 198 276 195 256 220 Z" fill="#34d399" />
    
    <!-- Verified Badge / Shield Sparkle -->
