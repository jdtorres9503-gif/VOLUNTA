<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="volunta-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="50%" stop-color="#059669" />
      <stop offset="100%" stop-color="#0d9488" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity="0.25"/>
    </filter>
  </defs>
  <!-- Background base rounded rectangle with safe zone for maskable icons -->
  <rect width="512" height="512" rx="108" fill="url(#volunta-grad)" />
  
  <!-- Outer security ring representing ISO 27001 & verified ESG trust -->
  <circle cx="256" cy="256" r="168" fill="none" stroke="rgba(255,255,255,0.22)" stroke-width="8" stroke-dasharray="16 10"/>
  
